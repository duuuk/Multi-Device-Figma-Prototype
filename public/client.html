<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Figma Sync — Client</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    #iframe-container {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .figma-frame {
      border: none; width: 100vw; height: 100vh;
      position: absolute; top: 50%; left: 50%; transform-origin: center center;
      background: #000;
    }
    .figma-frame.hidden-frame { visibility: hidden; pointer-events: none; }
    .figma-frame.active-frame { visibility: visible; pointer-events: auto; }

    #status {
      position: fixed; top: env(safe-area-inset-top, 12px); right: env(safe-area-inset-right, 12px);
      z-index: 9999; padding: 6px 14px; border-radius: 20px;
      font: 600 11px/1 -apple-system, sans-serif; text-transform: uppercase; color: #fff;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      transition: opacity 0.4s ease; pointer-events: none;
    }
    #status.connected { color: #4ade80; }
    #status.disconnected { color: #f87171; }
    #status.hidden { opacity: 0; }

    #areas-container { position: fixed; inset: 0; z-index: 9000; pointer-events: none; }
    .client-area {
      position: absolute; pointer-events: auto; cursor: pointer;
      /* background: rgba(255,0,0,0.15); border:1px solid red; /* debug */
    }
    .client-area:active { background: rgba(255,255,255,0.08); }
  </style>
</head>
<body>
  <div id="status" class="disconnected">Connecting…</div>
  <div id="iframe-container"></div>
  <div id="areas-container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    (() => {
      "use strict";

      const container = document.getElementById("iframe-container");
      const status = document.getElementById("status");
      const params = new URLSearchParams(window.location.search);

      const fileId = params.get('file') || '';
      const nodeId = params.get('node') || '';
      const clientId = params.get('client') || '';
      const host = params.get('host') || 'multi-device-sync';
      const deviceId = params.get('id') || 'unknown';
      const zoom = params.get('scale') || '1.14';

      // ── Helpers ────────────────────────────────────────────────────
      function buildEmbedUrl(fId, nId) {
        return `https://embed.figma.com/proto/${fId}/?node-id=${nId}&scaling=scale-down&hide-ui=1&embed-host=${host}&client-id=${clientId}`;
      }

      function parseNodeFromUrl(rawUrl) {
        try {
          const url = new URL(rawUrl);
          const m = url.pathname.match(/\/(?:file|design|proto)\/([a-zA-Z0-9]+)\//);
          let pFileId = m ? m[1] : fileId;
          let pNodeId = url.searchParams.get('node-id');
          if (pNodeId) pNodeId = pNodeId.replace('-', ':').replace('%3A', ':');
          return { fileId: pFileId, nodeId: pNodeId };
        } catch (e) { return { fileId, nodeId: null }; }
      }

      // ── Iframe Pool (lazy loading) ─────────────────────────────────
      // Iframes are registered with their URL but NOT loaded until needed.
      // This ensures Figma animations play fresh when the frame becomes visible.
      const iframePool = {};
      let activeFrameKey = null;

      function createPoolIframe(key, figmaUrl, loadNow) {
        if (iframePool[key]) return;
        const iframe = document.createElement('iframe');
        iframe.className = 'figma-frame hidden-frame';
        iframe.allowFullscreen = true;
        iframe.style.transform = `translate(-50%, -50%) scale(${zoom})`;
        if (loadNow) iframe.src = figmaUrl;
        container.appendChild(iframe);
        iframePool[key] = { iframe, url: figmaUrl, loaded: !!loadNow };
      }

      function switchToFrame(key) {
        if (!iframePool[key]) return;
        if (key === activeFrameKey) return;
        const entry = iframePool[key];

        const doSwap = () => {
          Object.entries(iframePool).forEach(([k, e]) => {
            if (k === key) {
              e.iframe.classList.remove('hidden-frame');
              e.iframe.classList.add('active-frame');
            } else {
              e.iframe.classList.remove('active-frame');
              e.iframe.classList.add('hidden-frame');
              // Unload non-primary iframes to reset animation state
              if (k !== 'primary') { e.iframe.src = ''; e.loaded = false; }
            }
          });
          activeFrameKey = key;
        };

        if (entry.loaded) {
          // Already loaded (e.g. primary at init) — swap immediately
          doSwap();
        } else {
          // Load fresh so animations play from start
          entry.iframe.src = entry.url;
          entry.loaded = true;
          // Old frame stays visible until new one loads + renders
          entry.iframe.onload = () => setTimeout(doSwap, 200);
        }
      }

      function frameKeyFromUrl(rawUrl) {
        const p = parseNodeFromUrl(rawUrl);
        return p.nodeId ? 'frame_' + p.fileId + '_' + p.nodeId : null;
      }

      function registerUrl(rawUrl) {
        const p = parseNodeFromUrl(rawUrl);
        if (!p.nodeId) return;
        const key = 'frame_' + p.fileId + '_' + p.nodeId;
        createPoolIframe(key, buildEmbedUrl(p.fileId, p.nodeId), false);
      }

      // ── Create primary iframe ──────────────────────────────────────
      if (fileId && nodeId) {
        createPoolIframe('primary', buildEmbedUrl(fileId, nodeId), true);
        switchToFrame('primary');
      }

      // ── Pre-load frames from `preload` param ──────────────────────
      const preloadParam = params.get('preload');
      if (preloadParam) {
        try {
          const urls = JSON.parse(decodeURIComponent(atob(preloadParam)));
          urls.forEach(url => registerUrl(url));
        } catch (e) { console.error("Failed to parse preload:", e); }
      }

      // ── Parse areas (for this device's tap overlays) ───────────────
      let areas = [];
      const areasParam = params.get('areas');
      if (areasParam) {
        try { areas = JSON.parse(decodeURIComponent(atob(areasParam))); }
        catch (e) { console.error("Failed to parse areas:", e); }
      }

      // Register frames from this device's own areas' frameMappings (lazy, no src set)
      areas.forEach(a => {
        if (a.frameMappings) {
          a.frameMappings.forEach(m => {
            if ((m.device === 'self' || m.device === deviceId) && m.frameUrl) registerUrl(m.frameUrl);
          });
        }
      });

      // ── Socket ─────────────────────────────────────────────────────
      const socket = io({ transports: ["websocket"] });
      let hideTimer;

      socket.on("connect", () => {
        status.textContent = "Connected"; status.className = "connected";
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => status.classList.add("hidden"), 3000);
      });
      socket.on("disconnect", () => {
        status.textContent = "Disconnected"; status.className = "disconnected";
        clearTimeout(hideTimer);
      });

      socket.on("execute-action", (payload) => {
        // ── Jump with frame mappings ─────────────────────────────────
        if (payload.direction === 'jump' && payload.frameMappings) {
          const myMapping = payload.frameMappings.find(m => m.device === deviceId)
                         || payload.frameMappings.find(m => m.device === 'all');
          if (myMapping && myMapping.frameUrl) {
            const key = frameKeyFromUrl(myMapping.frameUrl);
            if (key && iframePool[key]) {
              switchToFrame(key);
            } else if (key) {
              registerUrl(myMapping.frameUrl);
              switchToFrame(key);
            }
          }
          return;
        }

        // ── Standard next/prev ───────────────────────────────────────
        if (payload.target && payload.target !== 'all' && payload.target !== deviceId) return;
        const active = iframePool[activeFrameKey];
        if (active && active.iframe.contentWindow) {
          const type = payload.direction === "prev" ? "NAVIGATE_BACKWARD" : "NAVIGATE_FORWARD";
          active.iframe.contentWindow.postMessage({ type }, "https://www.figma.com");
        }
      });

      // ── Render tap area overlays ───────────────────────────────────
      if (areas.length > 0) {
        const ac = document.getElementById('areas-container');
        areas.forEach(area => {
          const div = document.createElement('div');
          div.className = 'client-area';
          div.style.left = area.x + '%'; div.style.top = area.y + '%';
          div.style.width = area.w + '%'; div.style.height = area.h + '%';

          const handler = (e) => {
            e.preventDefault();
            if (area.action === 'jump' && area.frameMappings) {
              // Resolve 'self' to actual deviceId before emitting
              const resolved = area.frameMappings
                .filter(m => m.frameUrl)
                .map(m => ({ device: m.device === 'self' ? deviceId : m.device, frameUrl: m.frameUrl }));
              socket.emit('trigger-action', { direction: 'jump', frameMappings: resolved });
            } else {
              socket.emit('trigger-action', { direction: area.action, target: area.target || 'all' });
            }
          };

          div.addEventListener('click', handler);
          div.addEventListener('touchend', handler);
          ac.appendChild(div);
        });
      }
    })();
  </script>
</body>
</html>
