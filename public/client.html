<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Figma Sync — Client</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #iframe-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #figma-frame {
      border: none;
      width: 100vw;
      height: 100vh;
      transition: transform 0.3s ease;
    }

    #status {
      position: fixed;
      top: env(safe-area-inset-top, 12px);
      right: env(safe-area-inset-right, 12px);
      z-index: 9999;
      padding: 6px 14px;
      border-radius: 20px;
      font: 600 11px/1 -apple-system, sans-serif;
      text-transform: uppercase;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    #status.connected { color: #4ade80; }
    #status.disconnected { color: #f87171; }
    #status.hidden { opacity: 0; }
  </style>
</head>

<body>

  <div id="status" class="disconnected">Connecting…</div>

  <div id="iframe-container">
    <iframe id="figma-frame" allowfullscreen></iframe>
  </div>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    (async () => {
      "use strict";

      const iframe = document.getElementById("figma-frame");
      const status = document.getElementById("status");
      const params = new URLSearchParams(window.location.search);
      const deviceId = params.get('id'); // e.g. 'left', 'center', 'right'

      // ── 1. Fetch Central Configuration ────────────────────────────
      let config = {};
      try {
        const response = await fetch('/api/config');
        config = await response.json();
      } catch (err) {
        console.warn("[config] Could not fetch central config, using URL params.");
      }

      const deviceSettings = (config.devices && deviceId) ? config.devices[deviceId] : {};

      // ── 2. Determine Final Values ─────────────────────────────────
      // Priority: URL Param > Central Config > Placeholder
      const fileId = params.get('file') || config.fileId || 'YOUR_FILE_ID';
      const clientId = params.get('client') || config.clientId || 'YOUR_CLIENT_ID';
      const nodeId = params.get('node') || deviceSettings.nodeId || 'YOUR_NODE_ID';
      const zoom = params.get('scale') || deviceSettings.scale || '1.14';
      const host = params.get('host') || 'multi-device-sync';

      // Apply settings
      iframe.style.transform = `scale(${zoom})`;
      iframe.src = `https://embed.figma.com/proto/${fileId}/PROJECT_NAME?node-id=${nodeId}&scaling=scale-down&hide-ui=1&embed-host=${host}&client-id=${clientId}`;

      // ── 3. Socket Connection ──────────────────────────────────────
      const socket = io({ transports: ["websocket"] });
      let hideTimer;

      socket.on("connect", () => {
        status.textContent = deviceId ? `Connected (${deviceId})` : "Connected";
        status.className = "connected";
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => status.classList.add("hidden"), 3000);
      });

      socket.on("disconnect", () => {
        status.textContent = "Disconnected";
        status.className = "disconnected";
        clearTimeout(hideTimer);
      });

      socket.on("execute-action", (payload) => {
        if (!iframe.contentWindow) return;
        const type = payload.direction === "prev" ? "NAVIGATE_BACKWARD" : "NAVIGATE_FORWARD";
        iframe.contentWindow.postMessage({ type }, "https://www.figma.com");
      });
    })();
  </script>
</body>

</html>
