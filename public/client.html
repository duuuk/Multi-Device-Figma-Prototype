<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Figma Sync — Client</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      /* Pure black for the bars if they show */
    }

    /* 
       The "Over-scan" trick:
       We make the iframe slightly larger than the screen (e.g., 105%)
       and center it to hide Figma's default margins/edges.
    */
    #iframe-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #figma-frame {
      border: none;
      /* These dimensions will be boosted by the 'scale' parameter in JS */
      width: 100vw;
      height: 100vh;
      transition: transform 0.3s ease;
    }

    #status {
      position: fixed;
      top: env(safe-area-inset-top, 12px);
      right: env(safe-area-inset-right, 12px);
      z-index: 9999;
      padding: 6px 14px;
      border-radius: 20px;
      font: 600 11px/1 -apple-system, sans-serif;
      text-transform: uppercase;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    #status.connected {
      color: #4ade80;
    }

    #status.disconnected {
      color: #f87171;
    }

    #status.hidden {
      opacity: 0;
    }

    /* Interactive Areas */
    #areas-container {
      position: fixed;
      inset: 0;
      z-index: 9000;
      pointer-events: none;
    }
    .client-area {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      /* background: rgba(255, 0, 0, 0.2); Uncomment to debug */
    }
  </style>
</head>

<body>

  <div id="status" class="disconnected">Connecting…</div>

  <div id="iframe-container">
    <iframe id="figma-frame" allowfullscreen></iframe>
  </div>

  <div id="areas-container"></div>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    (() => {
      "use strict";

      const iframe = document.getElementById("figma-frame");
      const status = document.getElementById("status");

      // ── 1. Dynamic Configuration ──────────────────────────────────
      const params = new URLSearchParams(window.location.search);

      // Values are passed via URL parameters dynamically from the setup dashboard
      const fileId = params.get('file') || '';
      const nodeId = params.get('node') || '';
      const clientId = params.get('client') || '';
      const host = params.get('host') || 'multi-device-sync';

      // 'scale' allows you to zoom in slightly to hide edges (e.g., 1.05)
      const zoom = params.get('scale') || '1.14';
      iframe.style.transform = `scale(${zoom})`;

      // Build the URL
      const figmaUrl = fileId && nodeId ? `https://embed.figma.com/proto/${fileId}/?node-id=${nodeId}&scaling=scale-down&hide-ui=1&embed-host=${host}&client-id=${clientId}` : '';
      if (figmaUrl) iframe.src = figmaUrl;

      // ── 2. Socket Connection ──────────────────────────────────────
      const socket = io({ transports: ["websocket"] });
      let hideTimer;

      socket.on("connect", () => {
        status.textContent = "Connected";
        status.className = "connected";
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => status.classList.add("hidden"), 3000);
      });

      socket.on("disconnect", () => {
        status.textContent = "Disconnected";
        status.className = "disconnected";
        clearTimeout(hideTimer);
      });

      socket.on("execute-action", (payload) => {
        if (!iframe.contentWindow) return;
        const type = payload.direction === "prev" ? "NAVIGATE_BACKWARD" : "NAVIGATE_FORWARD";
        iframe.contentWindow.postMessage({ type }, "https://www.figma.com");
      });

      // ── 3. Render Interactive Areas ──────────────────────────────────
      const areasParam = params.get('areas');
      if (areasParam) {
         try {
            const areasStr = decodeURIComponent(atob(areasParam));
            const areas = JSON.parse(areasStr);
            const container = document.getElementById('areas-container');
            
            function getEmbedUrl(rawUrl) {
               try {
                  const url = new URL(rawUrl);
                  const fileMatch = url.pathname.match(/\/(?:file|design|proto)\/([a-zA-Z0-9]+)\//);
                  let pFileId = fileMatch ? fileMatch[1] : fileId;
                  let pNodeId = url.searchParams.get('node-id');
                  if (pNodeId) pNodeId = pNodeId.replace('-', ':').replace('%3A', ':');
                  if (!pNodeId) return rawUrl;
                  return `https://embed.figma.com/proto/${pFileId}/?node-id=${pNodeId}&scaling=scale-down&hide-ui=1&embed-host=${host}&client-id=${clientId}`;
               } catch(e) { return rawUrl; }
            }

            areas.forEach(area => {
               const div = document.createElement('div');
               div.className = 'client-area';
               div.style.left = area.x + '%';
               div.style.top = area.y + '%';
               div.style.width = area.w + '%';
               div.style.height = area.h + '%';
               
               div.addEventListener('click', () => {
                  if (area.action === 'next') socket.emit('trigger-action', { direction: 'next' });
                  else if (area.action === 'prev') socket.emit('trigger-action', { direction: 'prev' });
                  else if (area.action === 'jump' && area.url) {
                     iframe.src = getEmbedUrl(area.url);
                  }
               });
               
               container.appendChild(div);
            });
         } catch(e) { console.error("Failed to parse areas:", e); }
      }
    })();
  </script>
</body>

</html>
