<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Figma Sync — Controller</title>
  <style>
    /* ── Reset & full-bleed ─────────────────────────────────────────── */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
    }

    #figma-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ── Connection status pill ─────────────────────────────────────── */
    #status {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 9999;
      padding: 6px 14px;
      border-radius: 20px;
      font: 600 11px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    #status.connected {
      background: rgba(34, 197, 94, 0.25);
      color: #4ade80;
    }

    #status.disconnected {
      background: rgba(239, 68, 68, 0.25);
      color: #f87171;
    }

    #status.hidden {
      opacity: 0;
    }

    /* ── Flash overlay for visual feedback on keypress ──────────────── */
    #flash {
      position: fixed;
      inset: 0;
      z-index: 9998;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease-out;
    }

    #flash.active {
      opacity: 1;
      transition: none;
    }

    #flash.next {
      background: rgba(99, 102, 241, 0.08);
    }

    #flash.prev {
      background: rgba(251, 146, 60, 0.08);
    }

    /* ── HUD bar (bottom) ──────────────────────────────────────────── */
    #hud {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 10px 20px;
      font: 500 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: rgba(255, 255, 255, 0.5);
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: opacity 0.4s ease;
      user-select: none;
    }

    #hud kbd {
      display: inline-block;
      padding: 2px 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      font-family: inherit;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.06);
    }

    #hud .sep {
      color: rgba(255, 255, 255, 0.15);
    }

    #clients-count {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>

<body>

  <div id="status" class="disconnected">Connecting…</div>
  <div id="flash"></div>

  <!--
    ╔══════════════════════════════════════════════════════════════════╗
    ║  CONFIGURE YOUR FIGMA EMBED URL BELOW                          ║
    ║                                                                  ║
    ║  Replace the placeholder values in the src attribute:            ║
    ║    • FILE_ID          → from your Figma file URL                 ║
    ║    • FILE_NAME        → the file name (URL-encoded)              ║
    ║    • STARTING_NODE    → the starting frame's node-id             ║
    ║    • YOUR_CLIENT_ID   → your Figma OAuth client ID               ║
    ╚══════════════════════════════════════════════════════════════════╝
  -->
  <iframe id="figma-frame"
    src="https://embed.figma.com/proto/YOUR_FILE_ID/PROJECT_NAME?node-id=YOUR_NODE_ID&scaling=scale-down&hide-ui=1&embed-host=multi-device-sync&client-id=YOUR_CLIENT_ID"
    allowfullscreen></iframe>

  <!-- HUD bar — visible only on the controller laptop -->
  <div id="hud">
    <span><kbd>←</kbd> Prev</span>
    <span class="sep">│</span>
    <span><kbd>→</kbd> Next</span>
    <span class="sep">│</span>
    <span>Clients: <strong id="clients-count">0</strong></span>
  </div>

  <!-- Socket.io client — served automatically by the Socket.io server -->
  <script src="/socket.io/socket.io.js"></script>

  <script>
    (() => {
      "use strict";

      // ── Elements ──────────────────────────────────────────────────
      const iframe = document.getElementById("figma-frame");
      const statusEl = document.getElementById("status");
      const flash = document.getElementById("flash");
      const clientsCount = document.getElementById("clients-count");

      // ── Socket connection ─────────────────────────────────────────
      const socket = io({ transports: ["websocket"] });

      let hideTimer;

      socket.on("connect", () => {
        statusEl.textContent = "Connected";
        statusEl.className = "connected";
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => statusEl.classList.add("hidden"), 3000);
      });

      socket.on("disconnect", () => {
        statusEl.textContent = "Disconnected";
        statusEl.className = "disconnected";
        clearTimeout(hideTimer);
      });

      // Update live client count (server pushes this)
      socket.on("clients-count", (count) => {
        clientsCount.textContent = count;
      });

      // ── The controller also receives its own broadcast ────────────
      // This ensures the laptop's prototype navigates at the EXACT same
      // moment as the iPads — driven by the same server event.
      socket.on("execute-action", (payload) => {
        if (!iframe || !iframe.contentWindow) return;

        const type =
          payload.direction === "prev"
            ? "NAVIGATE_BACKWARD"
            : "NAVIGATE_FORWARD";

        console.log("[sync] postMessage →", type);
        iframe.contentWindow.postMessage({ type }, "https://www.figma.com");
      });

      // ── Focus management ──────────────────────────────────────────
      // The Figma iframe will steal focus on click, swallowing all
      // keyboard events. We aggressively reclaim focus to the parent.
      function reclaimFocus() {
        window.focus();
        document.body.focus();
      }

      // Reclaim on any click on the page
      document.addEventListener("click", reclaimFocus, true);

      // Poll: if the iframe somehow grabs focus, take it back
      setInterval(() => {
        if (document.activeElement === iframe) {
          reclaimFocus();
        }
      }, 200);

      // Also reclaim when window regains visibility
      window.addEventListener("focus", reclaimFocus);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) reclaimFocus();
      });

      // ── Keyboard listener ────────────────────────────────────────
      // Intercepts ArrowRight / ArrowLeft BEFORE the browser can
      // forward them into the iframe, guaranteeing synchronisation.
      window.addEventListener(
        "keydown",
        (e) => {
          let direction = null;

          if (e.key === "ArrowRight") direction = "next";
          if (e.key === "ArrowLeft") direction = "prev";

          if (!direction) return;

          // Stop the browser from passing the key into the iframe
          e.preventDefault();
          e.stopPropagation();

          console.log("[key] →", direction);

          // Emit to server → server broadcasts → all clients + this page navigate
          socket.emit("trigger-action", { direction });

          // Visual flash feedback
          flash.className = direction;
          flash.classList.add("active");
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              flash.classList.remove("active");
            });
          });
        },
        { capture: true }   // <-- capture phase: fires BEFORE the iframe
      );
    })();
  </script>
</body>

</html>
