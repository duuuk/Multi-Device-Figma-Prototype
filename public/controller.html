<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Figma Sync — Master Controller</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #figma-frame {
      border: none;
      width: 100%;
      height: 100%;
    }

    #status {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 9999;
      padding: 6px 14px;
      border-radius: 20px;
      font: 600 11px/1 sans-serif;
      text-transform: uppercase;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    #status.connected {
      color: #4ade80;
    }

    #status.disconnected {
      color: #f87171;
    }

    #status.hidden {
      opacity: 0;
    }

    #flash {
      position: fixed;
      inset: 0;
      background: #fff;
      pointer-events: none;
      opacity: 0;
      z-index: 9998;
    }

    @keyframes flash-out {
      0% {
        opacity: 0.3;
      }

      100% {
        opacity: 0;
      }
    }

    #flash.active {
      animation: flash-out 0.3s ease-out forwards;
    }

    /* ── HUD Bar ────────────────────────────────────────────────── */
    #hud {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 24px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      gap: 20px;
      color: #fff;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      max-width: 95vw;
      overflow-x: auto;
    }

    #hud kbd {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 12px;
      margin-right: 4px;
      font-family: inherit;
      text-transform: uppercase;
      min-width: 22px;
      text-align: center;
      display: inline-block;
    }

    #hud span {
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      white-space: nowrap;
    }

    #hud .sep {
      color: rgba(255, 255, 255, 0.15);
    }

    /* Key fired badge */
    #key-badge {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      z-index: 10000;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 0.02em;
      padding: 20px 40px;
      border-radius: 20px;
      pointer-events: none;
      opacity: 0;
      transition: none;
    }

    #key-badge.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      transition: opacity 0.1s ease-out, transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #key-badge.fade {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.8);
      transition: opacity 0.3s ease-in, transform 0.3s ease-in;
    }
  </style>
</head>

<body>

  <div id="status" class="disconnected">Connecting…</div>
  <div id="flash"></div>

  <iframe id="figma-frame" allowfullscreen></iframe>

  <!-- HUD bar — visible only on the controller laptop -->
  <div id="hud">
    <span><kbd>←</kbd> Prev</span>
    <span class="sep">│</span>
    <span><kbd>→</kbd> Next</span>
    <span class="sep">│</span>
    <span id="hud-bindings"></span>
    <span class="sep">│</span>
    <span><strong id="clients-count">0</strong>&nbsp;Clients</span>
  </div>

  <!-- Key fired badge -->
  <div id="key-badge"></div>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    (() => {
      "use strict";

      const iframe = document.getElementById("figma-frame");
      const statusEl = document.getElementById("status");
      const flash = document.getElementById("flash");
      const clientsCount = document.getElementById("clients-count");
      const keyBadge = document.getElementById("key-badge");
      const hudBindings = document.getElementById("hud-bindings");

      // ── 1. Dynamic Configuration ──────────────────────────────────
      const params = new URLSearchParams(window.location.search);
      const fileId = params.get('file') || '';
      const nodeId = params.get('node') || '';
      const clientId = params.get('client') || '';
      const host = params.get('host') || 'multi-device-sync';

      // Build and set the iframe URL (only if a real ID is provided)
      const isPlaceholder = (!fileId || fileId === 'YOUR_FILE_ID' || fileId === 'fileID');
      if (!isPlaceholder && nodeId) {
        const figmaUrl = `https://embed.figma.com/proto/${fileId}/?node-id=${nodeId}&scaling=scale-down&hide-ui=1&embed-host=${host}&client-id=${clientId}`;
        iframe.src = figmaUrl;
      }

      // ── 2. Socket Connection ──────────────────────────────────────
      const socket = io({ transports: ["websocket"] });
      let hideTimer;
      let activeKeyBindings = [];

      socket.on("connect", () => {
        statusEl.textContent = "Connected";
        statusEl.className = "connected";
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => statusEl.classList.add("hidden"), 3000);
        // Fetch key bindings from server
        socket.emit("get-key-bindings", (bindings) => {
          activeKeyBindings = bindings || [];
          updateHudBindings();
        });
      });

      socket.on("disconnect", () => {
        statusEl.textContent = "Disconnected";
        statusEl.className = "disconnected";
        clearTimeout(hideTimer);
      });

      socket.on("clients-count", (count) => {
        clientsCount.textContent = count;
      });

      // Listen for live key binding updates from dashboard
      socket.on("key-bindings-updated", (bindings) => {
        activeKeyBindings = bindings || [];
        updateHudBindings();
      });

      function updateHudBindings() {
        if (!activeKeyBindings.length) {
          hudBindings.innerHTML = '<span style="color: rgba(255,255,255,0.3); font-size: 12px;">No key bindings</span>';
          return;
        }
        hudBindings.innerHTML = activeKeyBindings.map(b =>
          `<span style="margin-right: 8px;"><kbd>${b.key.toUpperCase()}</kbd> ${b.label || '?'}</span>`
        ).join('');
      }

      function showKeyBadge(key, label) {
        keyBadge.textContent = `${key.toUpperCase()}` + (label ? ` — ${label}` : '');
        keyBadge.className = '';
        // Force reflow
        void keyBadge.offsetWidth;
        keyBadge.classList.add('show');
        setTimeout(() => {
          keyBadge.classList.remove('show');
          keyBadge.classList.add('fade');
        }, 400);
      }

      socket.on("execute-action", (payload) => {
        if (!iframe.contentWindow) return;

        // Handle jump actions (from key bindings or tap areas)
        if (payload.direction === 'jump' && payload.frameMappings) {
          const myMapping = payload.frameMappings.find(m => m.device === 'controller');
          if (myMapping && myMapping.frameUrl) {
            const targetNodeId = parseNodeIdFromUrl(myMapping.frameUrl);
            if (targetNodeId) {
              iframe.contentWindow.postMessage({
                type: 'NAVIGATE_TO_FRAME_AND_CLOSE_OVERLAYS',
                data: { nodeId: targetNodeId, node_id: targetNodeId }
              }, "https://www.figma.com");
            }
          }
          return;
        }

        const type = payload.direction === "prev" ? "NAVIGATE_BACKWARD" : "NAVIGATE_FORWARD";

        // Use the verified Figma origin for maximum reliability
        iframe.contentWindow.postMessage({ type }, "https://www.figma.com");
      });

      function parseNodeIdFromUrl(rawUrl) {
        try {
          const url = new URL(rawUrl);
          let pNodeId = url.searchParams.get('node-id');
          if (pNodeId) return pNodeId.replace(/-/g, ':').replace(/%3A/gi, ':');
        } catch (e) {}
        return null;
      }

      // ── 3. Interaction & Keyboard ──────────────────────────────────
      window.addEventListener("keydown", (e) => {
        // Standard arrow key navigation
        if (e.key === "ArrowRight") {
          socket.emit("trigger-action", { direction: "next" });
          return;
        }
        if (e.key === "ArrowLeft") {
          socket.emit("trigger-action", { direction: "prev" });
          return;
        }

        // Custom key bindings
        const pressedKey = e.key.toLowerCase();
        const binding = activeKeyBindings.find(b => b.key.toLowerCase() === pressedKey);
        if (binding && binding.frameMappings && binding.frameMappings.length > 0) {
          e.preventDefault();
          e.stopPropagation();

          showKeyBadge(binding.key, binding.label);

          // Flash
          flash.classList.remove('active');
          void flash.offsetWidth;
          flash.classList.add('active');

          socket.emit("trigger-action", {
            direction: 'jump',
            frameMappings: binding.frameMappings.filter(m => m.frameUrl)
          });
          console.log('[KB] Emitted jump:', JSON.stringify(binding.frameMappings.filter(m => m.frameUrl)));
        }
      }, { capture: true });

      // Focus reclaiming
      window.addEventListener("blur", () => {
        setTimeout(() => window.focus(), 100);
      });
      document.addEventListener("click", () => window.focus());
    })();
  </script>
</body>

</html>
